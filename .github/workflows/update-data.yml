name: Update Fantasy Data

on:
  schedule:
    # Every 6 hours. Adjust as you like — cron is UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch FantasyPros rankings
        working-directory: scripts
        run: python fetch_fantasypros.py

      - name: Fetch ESPN league data
        working-directory: scripts
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_YEAR: ${{ secrets.ESPN_YEAR }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: python fetch_espn.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "Update fantasy data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
